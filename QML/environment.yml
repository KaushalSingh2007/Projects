name: qguard
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=23
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - statsmodels>=0.14
  - pyyaml>=6.0
  - pytest>=7.4
  - pip:
      # Installed via pip to track upstream releases closely.
      - pennylane>=0.35
      - torch>=2.1
      - umap-learn>=0.5
      - hydra-core>=1.3
      - mlflow>=2.9
      - huggingface_hub>=0.20
      - datasets>=2.16
      - ruff>=0.3
      - black>=24.0
      # Editable install of this package.
      - -e .
