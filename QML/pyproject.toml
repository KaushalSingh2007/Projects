[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qguard"
version = "0.0.1"
description = "Quantum Geometry-aware Unsupervised Anomaly detection for vibration-based Damage detection (Q-GUARD)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaushal Singh" }]
keywords = [
    "quantum machine learning",
    "structural health monitoring",
    "anomaly detection",
    "differential geometry",
    "quantum state learning",
]

# Core runtime dependencies. Heavy/optional groups are split out below so a
# minimal install (and CI smoke test) does not require torch/pennylane.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quantum = ["pennylane>=0.35"]
deep = ["torch>=2.1"]
viz = ["matplotlib>=3.7", "umap-learn>=0.5"]
features = ["statsmodels>=0.14"]
track = ["hydra-core>=1.3", "mlflow>=2.9"]
data = ["huggingface_hub>=0.20", "datasets>=2.16"]
dev = ["pytest>=7.4", "ruff>=0.3", "black>=24.0"]
# Convenience: everything needed to run the full pipeline.
all = [
    "pennylane>=0.35",
    "torch>=2.1",
    "matplotlib>=3.7",
    "umap-learn>=0.5",
    "statsmodels>=0.14",
    "hydra-core>=1.3",
    "mlflow>=2.9",
    "huggingface_hub>=0.20",
    "datasets>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
